schema_version: 1
exceptions:
  - id: EX-REL-004-FIX-INTENT-MODE
    capability_id: router:intent:fix
    status: approved_exception
    readiness_ref: REL-004
    rationale: Original Circuit treated bare "fix:" as Lite. Circuit intentionally keeps bare "fix:" at normal routing depth and reserves Lite for explicit quick/small/tiny/simple Fix language so serious bug fixes do not skip review.
    public_wording: Bare "fix:" selects the Fix flow; Lite requires an explicit quick/small/tiny/simple hint or an explicit mode flag.
  - id: EX-REL-007-WRITE-CAPABLE-DISCLOSURE
    capability_id: safety:write-capable-worker
    status: approved_exception
    readiness_ref: REL-007
    rationale: Write-capable worker behavior is now disclosed in first-run docs, progress output, and final summaries.
    public_wording: Write-capable worker behavior is disclosed before use.
  - id: EX-REL-004-DEVELOP-INTENT-REMOVED
    capability_id: router:intent:develop
    status: approved_exception
    readiness_ref: REL-004
    rationale: Circuit removed the deterministic flow classifier; routing is model-only. The operator or host names the flow, so the "develop:" goal-text intent prefix no longer exists as a routing capability.
    public_wording: Run Build with the explicit Build command; goal-text prefixes are no longer required or routed.
  - id: EX-REL-004-DECIDE-INTENT-REMOVED
    capability_id: router:intent:decide
    status: approved_exception
    readiness_ref: REL-004
    rationale: Circuit removed the deterministic flow classifier; routing is model-only. The operator or host names the flow, so the "decide:" goal-text intent prefix no longer exists as a routing capability.
    public_wording: Run Explore with the explicit Explore command; goal-text prefixes are no longer required or routed.
  - id: EX-REL-016-PLAN-EXECUTION-REMOVED
    capability_id: feature:plan-execution
    status: approved_exception
    readiness_ref: REL-016
    rationale: Circuit removed the deterministic flow classifier; routing is model-only. Entry-mode inference, including detecting an "Execute this plan:" request and selecting the first executable slice, no longer exists. The operator or host names the flow and points it at the plan.
    public_wording: To execute a plan, name the flow and point it at the plan; Circuit no longer infers a plan-execution entry mode from goal text.
  - id: EX-REL-011-BUILD-ANALYZE-GROUNDING
    capability_id: flow:build
    status: approved_exception
    readiness_ref: REL-011
    rationale: The original Build stage path was Frame, Plan, Act, Verify, Review, Close. Circuit adds a read-only Analyze stage (the gather-context grounding step) between Frame and Plan so the plan is grounded in a real read of the codebase before any edit. This is an intentional enhancement, not a regression - every original Build stage is preserved and the added stage only reads.
    public_wording: Build reads the codebase in a read-only Analyze stage before planning, so the plan is grounded in the actual code.
  - id: EX-REL-014-CODEX-MCP-FIRST-RUN
    claim_id: CLAIM-CODEX-MCP-LIFECYCLE
    proof_id: proof:codex-mcp-first-run
    status: approved_exception
    readiness_ref: REL-014
    rationale: The packaged MCP lifecycle is implemented, and the no-spend fresh-host loader proof passed for the exact 0.1.2 candidate in both packed and published modes, with the source ref and plugin tree digest bound (docs/release/proofs/runs/codex-mcp-first-run). The paid first-attempt Review proof and the two-architecture release matrix have not run because their evidence tooling does not exist yet. The README keeps steering sandboxed Codex work to the checkout until that proof lands.
    public_wording: The Codex plugin's fresh-host install and loader checks passed at the exact release candidate. The full paid end-to-end proof is an openly tracked gap, and the README steers sandboxed Codex work to the checkout until it lands.
