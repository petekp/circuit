<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1440" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="56" font-size="30" font-weight="700" fill="#0f172a">How a skill becomes operational through step hooks</text>
  <text x="60" y="90" font-size="17" fill="#64748b">One step's lifecycle, and the two points where a skill plugs in</text>

  <!-- ============ SPINE ============ -->
  <!-- Node 1: Step starts -->
  <rect x="60" y="126" width="200" height="76" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="86" cy="164" r="13" fill="#2563eb"/>
  <text x="86" y="169" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="110" y="170" font-size="17" font-weight="600" fill="#0f172a">Step starts</text>

  <!-- Node 2: Worker does the work -->
  <rect x="345" y="126" width="300" height="76" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="371" cy="164" r="13" fill="#2563eb"/>
  <text x="371" y="169" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="395" y="158" font-size="16" font-weight="600" fill="#0f172a">Worker does the work</text>
  <text x="395" y="181" font-size="12.5" fill="#64748b">a Claude / Codex subprocess</text>

  <!-- Node 3: Step finishes -->
  <rect x="720" y="126" width="260" height="76" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="746" cy="164" r="13" fill="#2563eb"/>
  <text x="746" y="169" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="770" y="158" font-size="16" font-weight="600" fill="#0f172a">Step finishes</text>
  <text x="770" y="181" font-size="12.5" fill="#64748b">the result is in hand</text>

  <!-- Node 4: Next step (future, dashed) -->
  <rect x="1065" y="126" width="180" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="1100" y="170" font-size="17" font-weight="600" fill="#475569">Next step</text>

  <!-- Spine arrows -->
  <line x1="262" y1="164" x2="341" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="647" y1="164" x2="716" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="982" y1="164" x2="1061" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- ============ BEFORE HOOK COLUMN ============ -->
  <rect x="60" y="250" width="600" height="480" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="90" y="302" font-size="23" font-weight="700" fill="#1d4ed8">BEFORE hook</text>
  <text x="90" y="328" font-size="14" fill="#64748b">informs the work &#183; fires when the step starts</text>

  <!-- Box A: SKILL.md -->
  <rect x="92" y="382" width="212" height="112" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="198" y="420" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">SKILL.md</text>
  <text x="110" y="448" font-size="13" fill="#475569">&#183; short description</text>
  <text x="110" y="470" font-size="13" fill="#475569">&#183; body (the instructions)</text>

  <!-- arrow A -> B -->
  <line x1="306" y1="438" x2="352" y2="438" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Box B: pasted into prompt -->
  <rect x="356" y="382" width="252" height="112" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="482" y="418" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">Pasted into the prompt</text>
  <text x="372" y="446" font-size="13" fill="#475569">under a "Selected Skills" header,</text>
  <text x="372" y="468" font-size="13" fill="#475569">the body added verbatim</text>

  <!-- dashed blue arc from Box B up into Node 2 (the work) -->
  <path d="M 600 408 C 656 348, 600 248, 582 206" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>

  <!-- caption -->
  <text x="92" y="552" font-size="14.5" fill="#334155">The whole body is pasted in verbatim. The worker reads it as guidance.</text>

  <!-- honesty badges -->
  <rect x="92" y="600" width="258" height="44" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="108" y="627" font-size="13" fill="#047857">&#10003; provable: the text was inserted</text>
  <rect x="362" y="600" width="246" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="378" y="627" font-size="13" fill="#64748b">&#10007; not provable: that it was used</text>

  <!-- ============ AFTER HOOK COLUMN ============ -->
  <rect x="700" y="250" width="680" height="480" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="730" y="302" font-size="23" font-weight="700" fill="#0f172a">AFTER hook</text>
  <text x="730" y="328" font-size="14" fill="#64748b">you have the result, so you can do anything that needs it &#183; fires when the step finishes</text>

  <!-- Branch A: inform the next step -->
  <rect x="728" y="360" width="624" height="120" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="750" y="396" font-size="18" font-weight="650" fill="#6d28d9">1 &#183; Inform the next step</text>
  <text x="750" y="424" font-size="14" fill="#475569">Bring a skill into the next step's before-hook, because of what just happened.</text>
  <text x="750" y="450" font-size="13" font-style="italic" fill="#7c3aed">No new machinery, it is the before hook one step later.</text>

  <!-- dashed violet arc from Branch A to Node 4 (next step) -->
  <path d="M 1352 412 C 1430 338, 1284 222, 1158 206" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>

  <!-- Branch B: make a record -->
  <rect x="728" y="502" width="624" height="216" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="750" y="538" font-size="18" font-weight="650" fill="#047857">2 &#183; Make a record of the finished work</text>

  <!-- Grade chip (highlighted, provable) -->
  <rect x="750" y="560" width="196" height="140" rx="10" fill="#059669"/>
  <text x="848" y="600" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Grade</text>
  <text x="848" y="628" font-size="14" fill="#ecfdf5" text-anchor="middle">pass / fail</text>
  <text x="848" y="648" font-size="14" fill="#ecfdf5" text-anchor="middle">+ findings</text>
  <text x="848" y="682" font-size="12.5" font-weight="600" fill="#d1fae5" text-anchor="middle">&#10003; a real grader runs</text>

  <!-- Summarize chip -->
  <rect x="958" y="560" width="190" height="140" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1053" y="600" font-size="17" font-weight="650" fill="#047857" text-anchor="middle">Summarize</text>
  <text x="1053" y="630" font-size="13" fill="#475569" text-anchor="middle">a digest</text>
  <text x="1053" y="650" font-size="13" fill="#475569" text-anchor="middle">for you</text>

  <!-- Record a lesson chip -->
  <rect x="1160" y="560" width="192" height="140" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1256" y="600" font-size="16" font-weight="650" fill="#047857" text-anchor="middle">Record a lesson</text>
  <text x="1256" y="630" font-size="13" fill="#475569" text-anchor="middle">write it to</text>
  <text x="1256" y="650" font-size="13" fill="#475569" text-anchor="middle">memory</text>

  <!-- ============ LEGEND ============ -->
  <rect x="754" y="664" width="2" height="0" fill="none"/>
  <text x="60" y="792" font-size="16" font-weight="700" fill="#0f172a">Reading it</text>

  <rect x="60" y="808" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="88" y="821" font-size="14" fill="#334155">Inform: the skill's text is handed to a worker as guidance (provable it was inserted, not that it was used).</text>

  <rect x="60" y="840" width="16" height="16" rx="3" fill="#059669"/>
  <text x="88" y="853" font-size="14" fill="#334155">Provable record: a real grader runs and returns a verdict Circuit can trust.</text>

  <rect x="60" y="872" width="16" height="16" rx="3" fill="#7c3aed"/>
  <text x="88" y="885" font-size="14" fill="#334155">Reach forward: an after-hook that only informs the next step is just a before-hook, one step later.</text>
</svg>
